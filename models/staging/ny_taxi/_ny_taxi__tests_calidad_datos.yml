version: 2

models:
  - name: stg_ny_taxi__yellow_trips
    description: Staging model for NYC yellow taxi trip data, cleaned and renamed from the raw source.
    columns:
      - name: vendor_id
        description: ID of the vendor that provided the trip record.
        tests:
          - not_null:
              config: 
                severity: warn
          - accepted_values:
              arguments: 
                values: [1,2,4]
                quote: false
              

      - name: pickup_datetime
        description: Timestamp when the meter was engaged.
        tests:
          - not_null

      - name: pickup_location_id
        description: TLC Taxi Zone in which the trip started.
        tests:
          - not_null

      - name: dropoff_location_id
        description: TLC Taxi Zone in which the trip ended.
        tests:
          - not_null

      - name: payment_type
        description: Numeric code signifying how the passenger paid for the trip.
        tests:
          - accepted_values:
              arguments: 
                values: [1, 2, 3, 4, 5, 6]
                quote: false

  - name: stg_ny_taxi__green_trips
    description: Staging model for NYC green taxi trip data, cleaned and renamed from the raw source.
    columns:
      - name: vendor_id
        description: ID of the vendor that provided the trip record.
        tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments: 
                values: [1,2]
                quote: false

      - name: pickup_datetime
        description: Timestamp when the meter was engaged.
        tests:
          - not_null

      - name: pickup_location_id
        description: TLC Taxi Zone in which the trip started.
        tests:
          - not_null

      - name: dropoff_location_id
        description: TLC Taxi Zone in which the trip ended.
        tests:
          - not_null

      - name: payment_type
        description: Numeric code signifying how the passenger paid for the trip.
        tests:
          - accepted_values:
              arguments: 
                values: [1, 2, 3, 4, 5, 6]
                quote: false