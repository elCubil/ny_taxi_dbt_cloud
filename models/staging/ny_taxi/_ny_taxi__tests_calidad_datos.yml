version: 2

models:
  - name: stg_ny_taxi__yellow_trips
    description: Staging model for NYC yellow taxi trip data, cleaned and renamed from the raw source. Se sabe que existen colisiones no únicas en los registros de origen cuando faltan datos de ubicación (DOLocationID/PULocationID = 264, "Unknown") y se combinan con marcas de tiempo de medianoche redondeadas; se trata de un problema de calidad de los datos en la fuente, no de un defecto en el diseño del hash.
    columns:
      - name: trip_id
        description: llave surrogate generada con los campos vendor, pickup datetime y pickup/dropoff location
        tests:
          - not_null
          - unique:
              config:
                severity: warn
        
      - name: vendor_id
        description: ID of the vendor that provided the trip record.
        tests:
          - not_null:
              config: 
                severity: warn
          - accepted_values:
              arguments: 
                values: [1,2,4]
                quote: false
              

      - name: pickup_datetime
        description: Timestamp when the meter was engaged.
        tests:
          - not_null

      - name: pickup_location_id
        description: TLC Taxi Zone in which the trip started.
        tests:
          - not_null

      - name: dropoff_location_id
        description: TLC Taxi Zone in which the trip ended.
        tests:
          - not_null

      - name: payment_type
        description: Numeric code signifying how the passenger paid for the trip.
        tests:
          - accepted_values:
              arguments: 
                values: [1, 2, 3, 4, 5, 6]
                quote: false

  - name: stg_ny_taxi__green_trips
    description: Staging model for NYC green taxi trip data, cleaned and renamed from the raw source.
    columns:
      - name: trip_id
        description: llave surrogate generada con los campos vendor, pickup datetime y pickup/dropoff location
        tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: vendor_id
        description: ID of the vendor that provided the trip record.
        tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments: 
                values: [1,2]
                quote: false

      - name: pickup_datetime
        description: Timestamp when the meter was engaged.
        tests:
          - not_null

      - name: pickup_location_id
        description: TLC Taxi Zone in which the trip started.
        tests:
          - not_null

      - name: dropoff_location_id
        description: TLC Taxi Zone in which the trip ended.
        tests:
          - not_null

      - name: payment_type
        description: Numeric code signifying how the passenger paid for the trip.
        tests:
          - accepted_values:
              arguments: 
                values: [1, 2, 3, 4, 5, 6]
                quote: false